<div class="card h-100 shadow-sm">
    <div class="card-header d-flex align-items-center gap-2 py-2">
        <i class="bi bi-cloud-sun-fill text-warning fs-5"></i>
        <span class="fw-semibold">Weer</span>
        <button id="weather-refresh" class="btn btn-sm btn-link ms-auto p-0 text-muted" title="Vernieuwen"
            aria-label="Weerbericht vernieuwen">
            <i class="bi bi-arrow-clockwise fs-5"></i>
        </button>
    </div>

    <div class="card-body d-flex flex-column gap-3">

        <!-- Zoekbalk -->
        <div class="input-group input-group-sm">
            <input type="text" id="weather-input" class="form-control" placeholder="Plaatsnaam of postcode..."
                aria-label="Locatie zoeken">
            <button id="weather-search" class="btn btn-outline-secondary" type="button" aria-label="Zoeken">
                <i class="bi bi-search"></i>
            </button>
        </div>

        <!-- Opgeslagen locaties -->
        <div id="weather-saved-locations" class="d-flex flex-wrap gap-1" role="list" aria-label="Opgeslagen locaties">
        </div>

        <!-- Weersweergave -->
        <div class="text-center flex-grow-1 d-flex flex-column justify-content-center py-2">
            <div id="weather-icon" class="display-2 mb-1 weather-main-icon">&#x1F324;</div>
            <div id="weather-temp" class="display-5 fw-bold mb-1">--</div>
            <div id="weather-desc" class="text-muted mb-3 text-capitalize">Geen locatie geselecteerd</div>
            <div class="row row-cols-3 g-2 text-center">
                <div class="col">
                    <i class="bi bi-droplet-fill text-primary"></i>
                    <div class="fw-semibold small" id="weather-humidity">--%</div>
                    <div class="text-muted weather-label">Vochtigheid</div>
                </div>
                <div class="col">
                    <i class="bi bi-wind text-info"></i>
                    <div class="fw-semibold small" id="weather-wind">-- km/h</div>
                    <div class="text-muted weather-label">Wind</div>
                </div>
                <div class="col">
                    <i class="bi bi-thermometer-half text-danger"></i>
                    <div class="fw-semibold small" id="weather-feels">--</div>
                    <div class="text-muted weather-label">Gevoelstemp</div>
                </div>
            </div>
        </div>

        <div class="text-end text-muted weather-label">
            Laatste update: <span id="weather-last-update">--</span>
        </div>

        <!-- 5-daagse voorspelling -->
        <div id="weather-forecast" class="d-flex gap-2 justify-content-between pt-2 border-top d-none">
            <!-- 5 dagen worden door TypeScript gegenereerd -->
            <!-- Elk item krijgt de klasse forecast-day -->
        </div>

    </div>
</div>
