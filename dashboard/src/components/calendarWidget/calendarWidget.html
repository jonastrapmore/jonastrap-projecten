<div class="card h-100 shadow-sm d-flex flex-column">
    <div class="card-header d-flex align-items-center gap-2 py-2">
        <i class="bi bi-calendar-week-fill text-primary fs-5"></i>
        <span class="fw-semibold">Agenda</span>
        <span class="ms-1 fw-normal text-muted small" id="calendar-week-label"></span>
        <div class="ms-auto d-flex align-items-center gap-1">
            <button id="calendar-prev" class="btn btn-sm btn-link p-1 text-muted" aria-label="Vorige week">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button id="calendar-today" class="btn btn-sm btn-link px-2 py-1 text-muted" aria-label="Huidige week">
                Vandaag
            </button>
            <button id="calendar-next" class="btn btn-sm btn-link p-1 text-muted" aria-label="Volgende week">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>

    <div class="card-body p-3 d-flex flex-column gap-3 overflow-auto">

        <!-- Aanmeld-scherm (zichtbaar zolang niet geauthenticeerd) -->
        <div id="calendar-auth-message" class="text-center text-muted py-4">
            <i class="bi bi-microsoft fs-1 d-block mb-2 text-primary"></i>
            <p class="mb-3 small">Verbinding met Outlook vereist om je agenda te tonen.</p>
            <button id="calendar-login-btn" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-box-arrow-in-right me-1"></i>Aanmelden met Microsoft
            </button>
        </div>

        <!-- Weekoverzicht (verborgen tot na authenticatie) -->
        <div id="calendar-content" class="d-none flex-column flex-grow-1 gap-2">

            <!-- Kolomkoppen: ma, di, wo, do, vr, za, zo -->
            <div class="calendar-week-grid" id="calendar-days-header">
                <!-- Worden door TypeScript gegenereerd -->
            </div>

            <!-- Evenementen per dag -->
            <div class="calendar-week-grid flex-grow-1" id="calendar-events-grid">
                <!-- Worden door TypeScript gegenereerd -->
            </div>

        </div>

    </div>
</div>
