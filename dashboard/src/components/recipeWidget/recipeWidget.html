<div class="card h-100 shadow-sm d-flex flex-column">
    <div class="card-header d-flex align-items-center gap-2 py-2">
        <i class="bi bi-egg-fried text-success fs-5"></i>
        <span class="fw-semibold">Menu van de dag</span>
        <button id="recipe-refresh" class="btn btn-sm btn-link ms-auto p-0 text-muted" title="Ander recept laden"
            aria-label="Ander recept laden">
            <i class="bi bi-shuffle fs-5"></i>
        </button>
    </div>

    <!-- Filters -->
    <div class="px-3 pt-3 d-flex gap-2 flex-wrap">
        <input type="checkbox" class="btn-check" id="filter-keto" autocomplete="off">
        <label class="btn btn-sm btn-outline-success" for="filter-keto">
            <i class="bi bi-lightning-charge-fill me-1"></i>Keto
        </label>
        <input type="checkbox" class="btn-check" id="filter-lowcal" autocomplete="off">
        <label class="btn btn-sm btn-outline-warning" for="filter-lowcal">
            <i class="bi bi-fire me-1"></i>Low Calorie
        </label>
        <input type="checkbox" class="btn-check" id="filter-quick" autocomplete="off">
        <label class="btn btn-sm btn-outline-primary" for="filter-quick">
            <i class="bi bi-clock me-1"></i>Snel klaar
        </label>
    </div>

    <div class="card-body d-flex flex-column gap-3 overflow-auto">

        <!-- Laad-indicator -->
        <div id="recipe-loading" class="text-center text-muted py-4">
            <div class="spinner-border spinner-border-sm me-2 text-success" role="status" aria-hidden="true"></div>
            Recept laden...
        </div>

        <!-- Receptweergave -->
        <div id="recipe-content" class="d-none d-flex flex-column gap-3">
            <img id="recipe-image" src="" alt="Gerecht" class="img-fluid rounded recipe-thumb">
            <div>
                <h5 class="mb-1 fw-semibold" id="recipe-name">--</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <span class="badge text-bg-secondary" id="recipe-category"></span>
                    <span class="badge text-bg-secondary bg-opacity-50" id="recipe-area"></span>
                    <span class="badge text-bg-warning d-none" id="recipe-calories"></span>
                    <span class="badge text-bg-info d-none" id="recipe-carbs"></span>
                    <span class="badge text-bg-success d-none" id="recipe-price"></span>
                </div>
            </div>
            <div>
                <h6 class="text-muted mb-2">Ingredienten</h6>
                <ul class="list-unstyled small mb-0 recipe-ingredients" id="recipe-ingredients-list"></ul>
            </div>
            <div class="d-flex gap-2 flex-wrap mt-auto">
                <a href="#" class="btn btn-sm btn-outline-success" id="recipe-source-link" target="_blank"
                    rel="noopener noreferrer">
                    <i class="bi bi-box-arrow-up-right me-1"></i>Volledig recept
                </a>
            </div>

            <!-- Vertaalbron -->
            <div class="text-end text-muted recipe-credit" id="recipe-credit"></div>
        </div>

    </div>
</div>
