<div class="card h-100 shadow-sm d-flex flex-column">
    <div class="card-header d-flex align-items-center gap-2 py-2">
        <i class="bi bi-check2-square text-success fs-5"></i>
        <span class="fw-semibold">Taken</span>
        <span class="badge bg-secondary ms-1" id="tasks-count">0</span>
        <button id="tasks-clear-done" class="btn btn-sm btn-link ms-auto p-0 text-muted"
            title="Voltooide taken verwijderen" aria-label="Voltooide taken verwijderen">
            <i class="bi bi-trash3"></i>
        </button>
    </div>

    <div class="card-body d-flex flex-column gap-3 p-3">

        <!-- Invoerveld -->
        <div class="input-group input-group-sm">
            <input type="text" id="task-input" class="form-control" placeholder="Nieuwe taak toevoegen..."
                aria-label="Taak toevoegen" maxlength="200">
            <button id="task-add" class="btn btn-outline-success" type="button" aria-label="Taak toevoegen">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>

        <!-- Filterknopjes -->
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary active" id="tasks-filter-all"
                data-filter="all">Alle</button>
            <button class="btn btn-sm btn-outline-secondary" id="tasks-filter-open" data-filter="open">Open</button>
            <button class="btn btn-sm btn-outline-secondary" id="tasks-filter-done" data-filter="done">Klaar</button>
        </div>

        <!-- Takenlijst -->
        <ul id="tasks-list" class="list-unstyled flex-grow-1 overflow-auto mb-0 tasks-scroll" aria-label="Takenlijst">
            <!-- Taken worden door TypeScript gegenereerd -->
        </ul>

        <!-- Lege toestand -->
        <div id="tasks-empty" class="text-center text-muted py-3 d-none">
            <i class="bi bi-check-circle fs-2 d-block mb-1 text-success"></i>
            Geen taken, goed bezig!
        </div>

    </div>
</div>
